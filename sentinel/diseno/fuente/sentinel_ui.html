<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sentinel · Diseño de la app</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --noche:#0B1220; --sup:#131C2E; --sup2:#1C2740; --borde:#2A3654;
  --txt:#EAF0FB; --txt2:#94A3BF;
  --azul:#2F6FEB; --azulc:#4C8DFF; --cian:#22D3EE; --violeta:#A78BFA;
  --verde:#22C55E; --ambar:#F5A524; --rojo:#FF5A5F; --rojof:#D92D2D;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#EEF1F7;font-family:Inter,system-ui,sans-serif;color:#0E1526;width:2240px;padding:56px 64px 64px}
.hd{display:grid;grid-template-columns:560px 1fr;gap:48px;align-items:start;margin-bottom:48px}
.hd h1{font:800 46px/1.05 Sora;letter-spacing:-.02em}
.hd h1 span{color:#2F6FEB}
.hd .sub{color:#5B6680;font-size:18px;line-height:1.45;margin-top:14px}
.hd .fuentes{margin-top:20px;display:flex;gap:28px;font-size:15px;color:#3A4560}
.hd .fuentes b{display:block;font:700 26px Sora;color:#0E1526}
.hd .fuentes i{font-style:normal;display:block;font:600 22px Inter;color:#0E1526}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.sw{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 0 #D9DFEA}
.sw .c{height:58px;display:flex}
.sw .c div{flex:1}
.sw .n{padding:9px 12px 11px}
.sw .n b{font:700 14px Inter;display:block}
.sw .n code{font:600 13px 'JetBrains Mono';color:#3A4560}
.sw .n span{display:block;font-size:12.5px;color:#5B6680;margin-top:3px;line-height:1.3}
.palt{grid-column:1/-1;font:700 13px Inter;letter-spacing:.08em;text-transform:uppercase;color:#5B6680;margin-top:4px}

.grid{display:grid;grid-template-columns:repeat(5,380px);justify-content:space-between;row-gap:56px}
.ph{width:380px;height:800px;border-radius:50px;background:#05070C;padding:10px;box-shadow:0 34px 60px -26px rgba(14,21,38,.55),0 0 0 2px #1d2333 inset}
.scr{width:360px;height:780px;border-radius:40px;overflow:hidden;background:var(--noche);color:var(--txt);position:relative;display:flex;flex-direction:column}
.cap{margin-top:20px;padding:0 6px}
.cap b{font:700 19px Sora}
.cap span{display:block;color:#5B6680;font-size:15px;line-height:1.4;margin-top:5px}

/* dentro del teléfono */
.sb{height:40px;display:flex;justify-content:space-between;align-items:center;padding:4px 24px 0 28px;font:600 13.5px Inter;flex:none}
.sb .r{display:flex;gap:6px;align-items:center}
.cam{width:11px;height:11px;border-radius:50%;background:#000;position:absolute;left:50%;top:14px;transform:translateX(-50%);box-shadow:0 0 0 2px #0e1424}
.ab{display:flex;align-items:center;gap:10px;padding:8px 18px 12px;flex:none}
.ab h2{font:700 21px Sora;flex:1;letter-spacing:-.01em}
.body{flex:1;padding:0 16px 14px;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.card{background:var(--sup);border:1px solid var(--borde);border-radius:18px;padding:14px}
.lbl{font:700 11px Inter;letter-spacing:.09em;text-transform:uppercase;color:var(--txt2)}
.row{display:flex;align-items:center;gap:12px}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.t1{font:600 15px Inter}
.t2{font-size:12.5px;color:var(--txt2);margin-top:2px;line-height:1.35}
.btn{height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font:600 15px Inter;flex:none}
.btn.pri{background:var(--azul);color:#fff}
.btn.sec{background:var(--sup2);color:var(--txt);border:1px solid var(--borde)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:99px;font:700 10.5px Inter;letter-spacing:.06em;white-space:nowrap}
.nav{flex:none;height:76px;border-top:1px solid var(--borde);background:#0E1628;display:grid;grid-template-columns:repeat(5,1fr);padding:9px 4px 16px}
.nav div{display:flex;flex-direction:column;align-items:center;gap:4px;font:500 10.5px Inter;color:var(--txt2);position:relative}
.nav .on{color:var(--azulc);font-weight:700}
.nav .pill{width:54px;height:30px;border-radius:99px;display:grid;place-items:center}
.nav .on .pill{background:rgba(76,141,255,.17)}
.nav .badge{position:absolute;top:-2px;right:14px;min-width:17px;height:17px;border-radius:9px;background:var(--rojof);color:#fff;font:700 10px/17px Inter;text-align:center}
.tg{width:44px;height:26px;border-radius:99px;background:#3A4566;position:relative;flex:none}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff}
.tg.on{background:var(--azul)}
.tg.on::after{left:21px}
.sep{height:1px;background:var(--borde);margin:10px 0}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.mono{font-family:'JetBrains Mono',monospace}
.sp{flex:1}
</style>
</head>
<body>

<div class="hd">
  <div>
    <h1>Sentinel<br><span>Diseño de la app</span></h1>
    <p class="sub">Borrador v1 para Stitch · Equipo Nanobots · Rally 2026<br>Modo oscuro por defecto: la app se usa de noche y en celulares viejos (la pantalla oscura gasta menos y no deslumbra).</p>
    <div class="fuentes">
      <div><b>Sora</b>Títulos</div>
      <div><i>Inter</i>Textos y botones</div>
      <div><i class="mono" style="font-family:'JetBrains Mono'">482 913</i>Códigos y números</div>
    </div>
  </div>
  <div class="pal" id="pal"></div>
</div>

<div class="grid" id="grid"></div>

<script>
const I = {
  shield:'<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  bell:'<path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>',
  house:'<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  phone:'<rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/>',
  tablet:'<rect width="16" height="20" x="4" y="2" rx="2"/><path d="M12 18h.01"/>',
  monitor:'<rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>',
  sliders:'<path d="M21 4h-7"/><path d="M10 4H3"/><path d="M21 12h-9"/><path d="M8 12H3"/><path d="M21 20h-5"/><path d="M12 20H3"/><path d="M14 2v4"/><path d="M8 10v4"/><path d="M16 18v4"/>',
  therm:'<path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/>',
  wifi:'<path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/>',
  wifioff:'<path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/>',
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
  alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  zap:'<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
  call:'<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>',
  siren:'<path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/>',
  door:'<path d="M18 20V6a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v14"/><path d="M2 20h20"/><path d="M14 12v.01"/>',
  dooropen:'<path d="M13 4h3a2 2 0 0 1 2 2v14"/><path d="M2 20h3"/><path d="M13 20h9"/><path d="M10 12v.01"/><path d="M13 4.562v16.157a1 1 0 0 1-1.242.97L5 20V5.562a2 2 0 0 1 1.515-1.94l4-1A2 2 0 0 1 13 4.561Z"/>',
  window:'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 12h18"/><path d="M12 3v18"/>',
  vibrate:'<path d="m2 8 2 2-2 2 2 2-2 2"/><path d="m22 8-2 2 2 2-2 2 2 2"/><rect width="8" height="14" x="8" y="5" rx="1"/>',
  scan:'<path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/>',
  chev:'<path d="m9 18 6-6-6-6"/>',
  back:'<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
  msg:'<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
  cloud:'<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>',
  pause:'<rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/>',
  lock:'<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  activity:'<path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/>',
  userplus:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/>',
  qr:'<rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/>',
  arrowdown:'<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>',
};
I.shieldok = I.shield + '<path d="m9 12 2 2 4-4"/>';
const ic = (n, s = 20, c = 'currentColor', w = 2) =>
  `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" style="flex:none">${I[n]}</svg>`;
const rgba = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const C = { azul:'#2F6FEB', azulc:'#4C8DFF', cian:'#22D3EE', violeta:'#A78BFA', verde:'#22C55E', ambar:'#F5A524', rojo:'#FF5A5F', rojof:'#D92D2D', txt2:'#94A3BF' };
const icoBox = (n, col, s = 40, is = 20) => `<div class="ico" style="width:${s}px;height:${s}px;background:${rgba(col, .15)};color:${col}">${ic(n, is)}</div>`;
const bat = (p, col = '#EAF0FB') => `<svg width="24" height="13" viewBox="0 0 24 13" style="flex:none"><rect x=".75" y=".75" width="20" height="11.5" rx="3" fill="none" stroke="${col}" stroke-opacity=".7" stroke-width="1.5"/><rect x="2.5" y="2.5" width="${16.5 * p / 100}" height="8" rx="1.5" fill="${col}"/><rect x="22" y="4.5" width="1.6" height="4" rx=".8" fill="${col}" fill-opacity=".7"/></svg>`;
const sb = (h, col = '#EAF0FB') => `<div class="cam"></div><div class="sb" style="color:${col}"><span>${h}</span><span class="r">${ic('wifi', 15, col, 2.4)}${bat(80, col)}</span></div>`;
const tabs = ['house:Inicio', 'phone:Equipos', 'clock:Horario', 'users:Vecinos', 'bell:Alertas'];
const nav = (on, badge = 0) => `<div class="nav">${tabs.map((t, i) => { const [n, l] = t.split(':'); return `<div class="${i === on ? 'on' : ''}"><span class="pill">${ic(n, 21, 'currentColor', i === on ? 2.3 : 1.8)}</span>${l}${i === 4 && badge ? `<span class="badge">${badge}</span>` : ''}</div>`; }).join('')}</div>`;
const tg = on => `<span class="tg ${on ? 'on' : ''}"></span>`;
const chip = (txt, col, solid = false) => `<span class="chip" style="background:${solid ? col : rgba(col, .16)};color:${solid ? '#0B1220' : col}">${txt}</span>`;

// QR decorativo determinista (con los 3 cuadros de esquina)
function qr(size) {
  const N = 25, m = size / N; let s = '';
  let h = 2166136261;
  const rnd = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 1000) / 1000; };
  const inF = (x, y) => (x < 8 && y < 8) || (x > N - 9 && y < 8) || (x < 8 && y > N - 9);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!inF(x, y) && rnd() > .52) s += `<rect x="${x * m}" y="${y * m}" width="${m + .3}" height="${m + .3}"/>`;
  for (const [fx, fy] of [[0, 0], [N - 7, 0], [0, N - 7]]) {
    s += `<rect x="${fx * m + m / 2}" y="${fy * m + m / 2}" width="${6 * m}" height="${6 * m}" rx="${m}" fill="none" stroke="#0B1220" stroke-width="${m}"/>`;
    s += `<rect x="${(fx + 2) * m}" y="${(fy + 2) * m}" width="${3 * m}" height="${3 * m}" rx="${m * .6}"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" fill="#0B1220">${s}</svg>`;
}
// anillo de estado
const anillo = (col, n, s = 150, label = '') => `
  <div style="width:${s}px;height:${s}px;border-radius:50%;display:grid;place-items:center;margin:0 auto;position:relative;
    background:radial-gradient(circle,${rgba(col, .22)} 0 38%,${rgba(col, .08)} 39% 58%,transparent 59%);">
    <div style="position:absolute;inset:0;border-radius:50%;border:2px solid ${rgba(col, .35)}"></div>
    <div style="position:absolute;inset:${s * .16}px;border-radius:50%;border:3px solid ${col}"></div>
    ${ic(n, s * .3, col, 2)}
  </div>${label}`;

const P = [];   // [html de la pantalla, título, explicación, esTarjeta]

// 1 · Elegir rol
P.push([`${sb('9:15')}
<div class="body" style="padding-top:18px;gap:14px">
  <div class="row" style="gap:12px">
    <div class="ico" style="width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#2F6FEB,#22D3EE);color:#fff">${ic('shieldok', 26, '#fff', 2.2)}</div>
    <div><div style="font:800 24px Sora;letter-spacing:-.02em">Sentinel</div><div class="t2" style="margin:0">Tu celular viejo cuida tu casa</div></div>
  </div>
  <div style="margin-top:10px"><div style="font:700 22px/1.2 Sora">¿Qué será este<br>dispositivo?</div><div class="t2" style="font-size:13.5px;margin-top:6px">Elige una opción. Puedes cambiarla después.</div></div>
  <div class="card" style="border:1.5px solid ${C.azulc};background:${rgba(C.azul, .12)};padding:16px">
    <div class="row" style="align-items:flex-start">${icoBox('shieldok', C.azulc, 46, 24)}
      <div style="flex:1">${chip('EMISOR', C.azulc)}<div style="font:700 18px Sora;margin-top:6px">Sentinela</div>
      <div class="t2" style="font-size:13px">El celular viejo que va en el soporte de la puerta o ventana. Detecta golpes y aperturas.</div></div>
      <span style="color:${C.azulc};margin-top:30px">${ic('chev', 20)}</span></div>
  </div>
  <div class="card" style="padding:16px">
    <div class="row" style="align-items:flex-start">${icoBox('bell', C.cian, 46, 24)}
      <div style="flex:1">${chip('RECEPTOR', C.cian)}<div style="font:700 18px Sora;margin-top:6px">Receptor</div>
      <div class="t2" style="font-size:13px">Recibe las alertas: tu celular, la tablet o la computadora de la casa.</div></div>
      <span style="color:${C.txt2};margin-top:30px">${ic('chev', 20)}</span></div>
  </div>
  <div class="row" style="padding:4px 4px;color:${C.violeta};font:600 14px Inter;gap:10px">${ic('users', 18)} Me invitaron como vecino de confianza</div>
  <div class="sp"></div>
  <div class="btn sec">${ic('scan', 19)} Escanear el QR de la caja</div>
</div>`, '1 · Elegir el rol', 'Es lo primero que ve la app: este equipo será Sentinela (emisor) o Receptor. El vecino entra por invitación.']);

// 2 · Vincular
P.push([`${sb('9:16')}
<div class="ab">${ic('back', 22)}<h2>Vincular equipo</h2></div>
<div class="body">
  <div style="display:grid;grid-template-columns:1fr 1fr;background:var(--sup);border:1px solid var(--borde);border-radius:14px;padding:4px;gap:4px">
    <div class="btn" style="height:38px;border-radius:10px;background:${C.azul};color:#fff;font-size:14px">${ic('shield', 16)} Sentinela</div>
    <div class="btn" style="height:38px;border-radius:10px;color:${C.txt2};font-size:14px">${ic('bell', 16)} Receptor</div>
  </div>
  <div class="card" style="display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px">
    <div style="background:#fff;border-radius:16px;padding:12px">${qr(168)}</div>
    <div class="mono" style="font-size:30px;letter-spacing:.12em">482 913</div>
    <div class="row" style="gap:6px;color:${C.txt2};font-size:13px">${ic('clock', 15)} El código vence en <b style="color:#EAF0FB">4:32</b></div>
  </div>
  <div class="card" style="padding:12px 14px">
    ${[['1', 'En el celular viejo, abre Sentinel y elige <b>Sentinela</b>.'], ['2', 'Escanea este código o escribe los 6 números.'], ['3', 'Ponle nombre: «Puerta principal», «Ventana cocina»…']].map(([n, t]) =>
      `<div class="row" style="gap:10px;padding:5px 0;align-items:flex-start"><span style="width:22px;height:22px;border-radius:50%;background:${rgba(C.azulc, .18)};color:${C.azulc};font:700 12px/22px Inter;text-align:center;flex:none">${n}</span><span style="font-size:13.5px;line-height:1.4">${t}</span></div>`).join('')}
  </div>
  <div class="row" style="gap:8px;justify-content:center;font-size:13px;color:${C.txt2}"><span class="dot" style="background:${C.verde};box-shadow:0 0 0 4px ${rgba(C.verde, .2)}"></span>Buscando en el wifi de la casa…</div>
</div>`, '2 · Vincular', 'El administrador (el primer receptor) muestra un QR; el equipo nuevo lo escanea. Así queda definido quién envía y quién recibe.']);

// 3 · Pantalla del Sentinela (emisor)
P.push([`<div style="position:absolute;inset:0;background:#04070D"></div><div style="position:relative;display:flex;flex-direction:column;height:100%">${sb('11:42')}
<div class="body" style="align-items:center;text-align:center;padding-top:10px;gap:10px">
  ${chip(ic('shield', 12, 'currentColor', 2.5) + ' SENTINELA · EMISOR', C.azulc)}
